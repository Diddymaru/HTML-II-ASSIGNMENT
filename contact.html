<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>

<body>

    <!-- Contact Page -->

    <header>

        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="contact.html">Contact</a>
        </nav>

        <hr>

    </header>

    <main>

        <section>

            <h2>Registration Form</h2>

            <form action="#" method="post">

                <div>

                    <label>Full Name:</label><br>

                    <input
                        type="text"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>

                </div>

                <br>

                <div>

                    <label>Email:</label><br>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <br>

                <div>

                    <label>Password:</label><br>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

                <br>

                <div>

                    <label>Gender:</label><br>

                    <input
                        type="radio"
                        name="gender"
                        value="male">
                    Male

                    <input
                        type="radio"
                        name="gender"
                        value="female">
                    Female

                </div>

                <br>

                <div>

                    <label>Hobbies:</label><br>

                    <input
                        type="checkbox"
                        name="hobby"
                        value="coding">
                    Coding

                    <input
                        type="checkbox"
                        name="hobby"
                        value="gaming">
                    Gaming

                    <input
                        type="checkbox"
                        name="hobby"
                        value="music">
                    Music

                </div>

                <br>

                <div>

                    <label>Select Your Country:</label><br>

                    <select name="country">

                        <option value="nigeria">Nigeria</option>

                        <option value="ghana">Ghana</option>

                        <option value="kenya">Kenya</option>

                    </select>

                </div>

                <br>

                <div>

                    <label>Message:</label><br>

                    <textarea
                        name="message"
                        rows="5"
                        cols="30"
                        placeholder="Enter your message">
                    </textarea>

                </div>

                <br>

                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

    <hr>

    <footer>

        <p>Created by Martins</p>

    </footer>

</body>

</html>
